name: Feature request
description: Suggest a feature or a change to how clarusjs works
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Some parts of clarusjs are fixed on purpose: the HTML markers, server code never reaching the client, and
        JavaScript only for stateful components. If your idea touches one of these, say why it's worth changing.
        The design lives in docs/architecture.md.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to build, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. A sketch of the `.tscl` syntax or config you'd write is very welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other ways you considered, or what you do now. How other frameworks handle it is useful too.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Template syntax
        - State and signals
        - Rendering modes (static, server, client)
        - Routing and navigation
        - Vite plugin and build
        - Type checking and editor support
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this.
