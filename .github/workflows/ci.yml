name: CI

on:
  push:
    branches: [main]
  # Every pull request, including stacked ones whose base is another PR's branch.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The supported range in engines.node: the oldest LTS line and the current one.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The VS Code extension packages (its grammar and snippet tests ran with pnpm test).
      - run: pnpm --filter clarusjs-vscode package

  windows:
    # #54: paths with backslashes and drive letters (island entry names, dev URLs, /@fs/). The framework's own tests.
    name: clarusjs on Windows
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter clarusjs test

  docker:
    # #601: examples/docker's image (the deploy guide's Dockerfile) with this checkout's clarusjs, built and run.
    name: Docker image (build + run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sh scripts/docker-smoke.sh

  docs:
    name: Docs site (build + browser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm --filter @clarusjs/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @clarusjs/docs test:e2e
      # the same site under a base (/clarusjs/, as on GitHub Pages): every link, file and script stays under it
      - run: pnpm --filter @clarusjs/docs test:e2e:base
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/docs/test-results

  ui-site:
    name: UI site (build + browser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:check
      - run: pnpm --filter @clarusjs/ui-site exec playwright install --with-deps chromium
      - run: pnpm --filter @clarusjs/ui-site test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-site-playwright-report
          path: packages/ui-site/test-results

  size:
    # The gzip size of every browser script the docs site ships, compared with the PR's base branch, as a comment.
    # The hard budgets are tests (packages/clarusjs/test); this shows growth before a budget fails.
    name: Size report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Pinned to a commit: this third-party action gets write access to pull requests.
      - uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # v2
        with:
          build-script: docs:build
          pattern: 'packages/docs/dist/client/assets/**/*.js'
          # Hashed names (cl-router-DugxQuNw.js) compare as the same file across builds.
          strip-hash: '-([A-Za-z0-9_-]{8})\.js$'
          compression: gzip
          minimum-change-threshold: 1
