packages:
  - packages/*
  - examples/*

# Install scripts: none run. @vscode/vsce-sign's (via @vscode/vsce) fetches a signing tool that packaging a .vsix
# doesn't use (signing is a Marketplace publish step). @parcel/watcher's (via @tailwindcss/cli) builds a fallback for
# platforms without a prebuilt binary (those come as optional dependencies), and only --watch uses it.
allowBuilds:
  '@parcel/watcher': false
  '@vscode/vsce-sign': false

# GHSA-g3hv-75wg-m249 (minimatch < 11.0.1: pattern amplification). @vscode/vsce and vscode-languageclient (the VS Code
# extension) still ask for ^10.2.6, and no 10.x is patched. Both work with 11: the extension's tests, build and
# `vsce package` pass, and vscode-languageclient's require('minimatch') / new Minimatch() match as before.
# Remove when both allow minimatch 11.
overrides:
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
