packages:
  - packages/*
  - examples/*
  # A standalone app (its own npm install, from the registry), as people copy it: see its Dockerfile.
  - '!examples/docker'

# Install scripts: none run. @vscode/vsce-sign's (via @vscode/vsce) fetches a signing tool that packaging a .vsix
# doesn't use (signing is a Marketplace publish step). @parcel/watcher's (via @tailwindcss/cli) builds a fallback for
# platforms without a prebuilt binary (those come as optional dependencies), and only --watch uses it.
allowBuilds:
  '@parcel/watcher': false
  '@vscode/vsce-sign': false

# GHSA-g3hv-75wg-m249 (minimatch < 11.0.1: pattern amplification). @vscode/vsce and vscode-languageclient (the VS Code
# extension) still ask for ^10.2.6, and no 10.x is patched. @vscode/vsce works with 11. vscode-languageclient calls
# Minimatch#makeRe(), which 11 removed: the extension crashed on startup (0.3.0, "n.makeRe is not a function"), so it is
# patched below to check the parsed pattern instead (packages/vscode/test/bundle.test.ts guards it).
# Remove both when vscode-languageclient allows minimatch 11.
overrides:
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1

patchedDependencies:
  vscode-languageclient@11.0.0: patches/vscode-languageclient@11.0.0.patch
