# The docs site (packages/docs), built with clarusjs. Static pages are files; server routes run as a Netlify
# Function that clarusjs writes to packages/docs/.netlify/v1/functions (Netlify's Frameworks API reads it from the
# base directory).
[build]
  base = "packages/docs"
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"
